
name: Compilar APK Rota 99

on:
  workflow_dispatch:
  push:
    paths:
      - 'Rota99_APK_projeto_android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip Rota99_APK_projeto_android.zip -d projeto

      - name: Compilar APK
        run: |
          gradle -p projeto assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rota99-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
